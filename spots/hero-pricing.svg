<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" width="1440" height="560" fill="none" role="presentation">
  <!-- /pricing hero 背景:計量的渠道 —— 三條寬度不一的計價帶,一條燼橘;amber 刻度。 -->
  <defs>
    <filter id="g" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="9" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="s"/>
      <feComponentTransfer in="s" result="a"><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
      <feComposite in="a" in2="SourceAlpha" operator="in" result="m"/>
      <feBlend in="SourceGraphic" in2="m" mode="multiply"/>
    </filter>
  </defs>
  <g filter="url(#g)">
    <rect x="880" y="120" width="520" height="34" rx="17" fill="#e5e1da"/>
    <rect x="880" y="196" width="420" height="46" rx="23" fill="#c9c2b6"/>
    <rect x="880" y="286" width="480" height="60" rx="30" fill="#f04d3b"/>
    <rect x="880" y="390" width="300" height="26" rx="13" fill="#e5e1da"/>
    <circle cx="1360" cy="316" r="26" fill="#ffb45b"/>
  </g>
  <g stroke="#ffb45b" stroke-width="3" stroke-linecap="round">
    <path d="M920 366v-10"/><path d="M980 370v-14"/><path d="M1040 366v-10"/>
    <path d="M1100 370v-14"/><path d="M1160 366v-10"/><path d="M1220 370v-14"/>
  </g>
  <g stroke="#2a2a28" stroke-width="1.4" stroke-linecap="round" opacity="0.45" fill="none">
    <path d="M880 96h520"/><path d="M1390 86l10 10-10 10"/>
    <path d="M846 250c8-8 16 8 24 0"/><path d="M1400 430l14-14"/>
  </g>
</svg>
