<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" fill="none" role="presentation">
  <!-- 收尾 CTA 的深色背景 —— hero 幾何語彙的深色版:橫向流線收束後計量輸出。
       刻意不放大形狀:這一塊上面有標題與兩顆按鈕,背景只能當紙紋,
       先前版本的大圓環正好落在按鈕後面,字都讀不清。 -->
  <defs>
    <filter id="g" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="6" result="n" />
      <feColorMatrix in="n" type="saturate" values="0" result="s" />
      <feComponentTransfer in="s" result="a"><feFuncA type="linear" slope="0.09" /></feComponentTransfer>
      <feComposite in="a" in2="SourceAlpha" operator="in" result="m" />
      <feBlend in="SourceGraphic" in2="m" mode="screen" />
    </filter>
  </defs>

  <g filter="url(#g)">
    <!-- 多條入口流線:粗細不一,往右收束 -->
    <rect x="0" y="40" width="520" height="10" rx="5" fill="#ffffff" opacity="0.07" />
    <rect x="0" y="88" width="700" height="14" rx="7" fill="#ffffff" opacity="0.09" />
    <rect x="0" y="150" width="600" height="10" rx="5" fill="#ffffff" opacity="0.06" />
    <rect x="0" y="212" width="460" height="12" rx="6" fill="#ffffff" opacity="0.07" />
    <rect x="0" y="262" width="760" height="10" rx="5" fill="#ffffff" opacity="0.05" />

    <!-- 收束後的單一輸出:唯一一條 ember,細而長 -->
    <rect x="700" y="86" width="500" height="18" rx="9" fill="#f04d3b" opacity="0.42" />
    <!-- 計量方塊:跟在輸出線之後 -->
    <g fill="#ffb45b" opacity="0.5">
      <rect x="1120" y="132" width="12" height="12" rx="3" />
      <rect x="1146" y="132" width="12" height="12" rx="3" />
      <rect x="1172" y="132" width="12" height="12" rx="3" />
    </g>
  </g>

  <!-- 細墨線:匯流與記號 -->
  <g stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.22">
    <path d="M520 45h140l40 48" />
    <path d="M600 155h60l40 -48" />
    <path d="M460 218h200l40 -110" />
    <path d="M1160 60l14-14" />
    <path d="M40 250c8-8 16 8 24 0s16 8 24 0" />
  </g>

  <!-- amber 刻度:沿輸出線下緣 -->
  <g stroke="#ffb45b" stroke-width="2" stroke-linecap="round" opacity="0.4">
    <path d="M760 118v-6" /><path d="M820 120v-8" /><path d="M880 118v-6" />
    <path d="M940 120v-8" /><path d="M1000 118v-6" /><path d="M1060 120v-8" />
  </g>
</svg>
