<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" width="1440" height="560" fill="none" role="presentation">
  <!-- /enterprise hero 背景:多條供應商渠道匯成一份帳,閥門在中間。 -->
  <defs>
    <filter id="g" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="5" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="s"/>
      <feComponentTransfer in="s" result="a"><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
      <feComposite in="a" in2="SourceAlpha" operator="in" result="m"/>
      <feBlend in="SourceGraphic" in2="m" mode="multiply"/>
    </filter>
  </defs>
  <g filter="url(#g)">
    <path d="M860 120h180c60 0 60 150 120 150h-300z" fill="#e5e1da"/>
    <path d="M860 250h300v40H860z" fill="#c9c2b6"/>
    <path d="M860 420h180c60 0 60-130 120-130h-300z" fill="#e5e1da"/>
    <circle cx="1196" cy="270" r="46" fill="#b0aca6"/>
    <circle cx="1196" cy="270" r="18" fill="#f1efec"/>
    <rect x="1250" y="244" width="180" height="52" rx="26" fill="#f04d3b"/>
  </g>
  <g stroke="#ffb45b" stroke-width="3" stroke-linecap="round">
    <path d="M1280 320v-12"/><path d="M1320 324v-16"/><path d="M1360 320v-12"/><path d="M1400 324v-16"/>
  </g>
  <g stroke="#2a2a28" stroke-width="1.4" stroke-linecap="round" opacity="0.45" fill="none">
    <path d="M1250 200h150"/><path d="M1392 192l10 8-10 8"/>
    <path d="M840 350c8-8 16 8 24 0"/>
  </g>
</svg>
