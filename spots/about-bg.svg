<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" width="1440" height="640" fill="none" role="presentation">
  <!-- About hero 背景（手繪矢量，取代先前的 1536×1024 raster：
       背景會被 object-cover 放大，點陣一定糊，矢量在任何尺寸都銳利。
       構圖規則同 DESIGN.md 插圖系統：暖灰階 + 單一燼橘 + 細墨線記號，
       左半刻意留空給文案。 -->
  <defs>
    <!-- riso 顆粒：與生成插圖同一種紙面質感 -->
    <filter id="grain" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" result="n" />
      <feColorMatrix in="n" type="saturate" values="0" result="g" />
      <feComponentTransfer in="g" result="g2">
        <feFuncA type="linear" slope="0.16" intercept="0" />
      </feComponentTransfer>
      <feComposite in="g2" in2="SourceAlpha" operator="in" result="grainMasked" />
      <feBlend in="SourceGraphic" in2="grainMasked" mode="multiply" />
    </filter>

    <!-- 落雨匯聚的光錐 -->
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9e4db" stop-opacity="0.85" />
      <stop offset="1" stop-color="#f2efe8" stop-opacity="0.25" />
    </linearGradient>

    <!-- 雨滴：24×34，底部圓、頂端收尖 -->
    <symbol id="drop" viewBox="0 0 24 34">
      <path d="M12 0c0 0 12 14.6 12 22a12 12 0 0 1-24 0C0 14.6 12 0 12 0Z" />
    </symbol>
  </defs>

  <g filter="url(#grain)">
    <!-- 匯聚光錐（雨往一點收束的視覺骨架） -->
    <path d="M900 -40 L1400 -40 L1230 470 L1105 470 Z" fill="url(#cone)" />
    <!-- 上方雲團：兩個交疊的圓角形，深淺各一 -->
    <path d="M1010 24c58-46 132-38 172 12 44-54 128-58 176-8 40 42 26 106-32 122H1046c-56-14-72-84-36-126Z" fill="#dcd6cb" opacity="0.9" />
    <path d="M1198 8c46-34 108-28 140 14 34-44 104-46 142-4 32 36 20 88-28 100h-236c-46-12-58-72-18-110Z" fill="#c9c2b6" opacity="0.65" />
  </g>

  <!-- 雨絲：細墨線，長度與粗細不一 -->
  <g stroke="#2a2a28" stroke-width="1" opacity="0.34">
    <path d="M932 92v96" /><path d="M986 60v128" /><path d="M1040 108v84" />
    <path d="M1094 44v150" /><path d="M1148 84v104" /><path d="M1202 62v122" />
    <path d="M1256 100v92" /><path d="M1310 52v138" /><path d="M1364 96v84" />
    <path d="M959 150v78" /><path d="M1067 168v66" /><path d="M1175 158v74" />
    <path d="M1283 176v60" /><path d="M1391 150v72" />
  </g>

  <!-- 雨滴群：灰階三階，唯一一滴燼橘（配給制） -->
  <g filter="url(#grain)">
    <use href="#drop" x="920" y="176" width="24" height="34" fill="#b0aca6" />
    <use href="#drop" x="974" y="152" width="26" height="37" fill="#8f8a83" />
    <use href="#drop" x="1030" y="186" width="22" height="31" fill="#c9c2b6" />
    <use href="#drop" x="1082" y="140" width="28" height="40" fill="#6f6a63" />
    <use href="#drop" x="1138" y="176" width="24" height="34" fill="#a5a09a" />
    <use href="#drop" x="1192" y="150" width="26" height="37" fill="#c1baae" />
    <use href="#drop" x="1246" y="184" width="22" height="31" fill="#8f8a83" />
    <use href="#drop" x="1300" y="146" width="30" height="42" fill="#4a463f" />
    <use href="#drop" x="1356" y="180" width="24" height="34" fill="#b0aca6" />

    <use href="#drop" x="948" y="240" width="22" height="31" fill="#c9c2b6" />
    <use href="#drop" x="1056" y="246" width="24" height="34" fill="#a5a09a" />
    <use href="#drop" x="1164" y="242" width="22" height="31" fill="#8f8a83" />
    <use href="#drop" x="1272" y="248" width="24" height="34" fill="#c1baae" />
    <use href="#drop" x="1380" y="236" width="22" height="31" fill="#b0aca6" />

    <use href="#drop" x="1004" y="300" width="24" height="34" fill="#b0aca6" />
    <use href="#drop" x="1112" y="308" width="22" height="31" fill="#8f8a83" />
    <use href="#drop" x="1220" y="302" width="24" height="34" fill="#c9c2b6" />
    <use href="#drop" x="1328" y="312" width="22" height="31" fill="#a5a09a" />

    <use href="#drop" x="1060" y="368" width="24" height="34" fill="#c1baae" />
    <use href="#drop" x="1168" y="376" width="22" height="31" fill="#b0aca6" />

    <!-- 唯一的燼橘：正在落入金鑰的那一滴 -->
    <use href="#drop" x="1150" y="432" width="28" height="40" fill="#f04d3b" />
  </g>

  <!-- 落地漣漪：同心弧 -->
  <g stroke="#2a2a28" stroke-width="1" opacity="0.22" fill="none">
    <path d="M1096 556a26 8 0 1 0 52 0" /><path d="M1084 566a38 11 0 1 0 76 0" />
    <path d="M1258 548a20 6 0 1 0 40 0" /><path d="M1248 556a30 9 0 1 0 60 0" />
  </g>

  <!-- 金鑰：橫置，雨匯聚的終點（頭部圓環 + 桿 + 兩齒） -->
  <g filter="url(#grain)">
    <rect x="1128" y="522" width="230" height="26" rx="13" fill="#f04d3b" />
    <circle cx="1128" cy="535" r="42" fill="#f04d3b" />
    <circle cx="1128" cy="535" r="17" fill="#f1efec" />
    <rect x="1290" y="548" width="18" height="24" rx="4" fill="#f04d3b" />
    <rect x="1330" y="548" width="18" height="16" rx="4" fill="#f04d3b" />
  </g>

  <!-- amber 刻度：計量的記號，跟在金鑰旁 -->
  <g stroke="#ffb45b" stroke-width="3" stroke-linecap="round" opacity="0.95">
    <path d="M1180 496v-16" /><path d="M1212 496v-22" /><path d="M1244 496v-16" />
    <path d="M1276 496v-22" /><path d="M1308 496v-16" />
  </g>

  <!-- 墨線記號：波浪與短斜線（插圖語言的簽名） -->
  <g stroke="#2a2a28" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M1372 470c8-8 16 8 24 0s16 8 24 0" />
    <path d="M894 430c8-8 16 8 24 0" />
    <path d="M1402 520l14-16" /><path d="M1414 540l16-12" />
  </g>
</svg>
