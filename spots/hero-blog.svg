<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" width="1440" height="560" fill="none" role="presentation">
  <!-- /blog hero 背景:閱讀線 —— 長短不一的文字行,一行燼橘(進度),配幾滴雨。 -->
  <defs>
    <filter id="g" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="11" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="s"/>
      <feComponentTransfer in="s" result="a"><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
      <feComposite in="a" in2="SourceAlpha" operator="in" result="m"/>
      <feBlend in="SourceGraphic" in2="m" mode="multiply"/>
    </filter>
    <symbol id="drop" viewBox="0 0 24 34"><path d="M12 0c0 0 12 14.6 12 22a12 12 0 0 1-24 0C0 14.6 12 0 12 0Z"/></symbol>
  </defs>
  <g filter="url(#g)">
    <g fill="#e5e1da">
      <rect x="900" y="120" width="440" height="16" rx="8"/>
      <rect x="900" y="152" width="380" height="16" rx="8"/>
      <rect x="900" y="216" width="420" height="16" rx="8"/>
      <rect x="900" y="248" width="300" height="16" rx="8"/>
      <rect x="900" y="312" width="400" height="16" rx="8"/>
      <rect x="900" y="376" width="340" height="16" rx="8"/>
      <rect x="900" y="408" width="240" height="16" rx="8"/>
    </g>
    <rect x="900" y="184" width="200" height="16" rx="8" fill="#b0aca6"/>
    <rect x="900" y="344" width="260" height="16" rx="8" fill="#b0aca6"/>
    <!-- 左緣閱讀進度線:燼橘 -->
    <rect x="872" y="120" width="4" height="180" rx="2" fill="#f04d3b"/>
    <rect x="872" y="300" width="4" height="124" rx="2" fill="#e5e1da"/>
    <use href="#drop" x="1372" y="150" width="24" height="34" fill="#c9c2b6"/>
    <use href="#drop" x="1338" y="300" width="20" height="28" fill="#f04d3b"/>
  </g>
  <g stroke="#2a2a28" stroke-width="1.4" stroke-linecap="round" opacity="0.4" fill="none">
    <path d="M1390 420c8-8 16 8 24 0"/><path d="M852 460l14-14"/>
  </g>
  <g stroke="#ffb45b" stroke-width="3" stroke-linecap="round"><path d="M900 452h120"/></g>
</svg>
