      <rect x="1154" y="242" width="38" height="38" rx="9"/>
    </g>
    <rect x="1106" y="242" width="38" height="38" rx="9" fill="#f04d3b" opacity="0.34"/>
    <rect x="0" y="40" width="980" height="14" rx="7" fill="#ffffff" opacity="0.07"/>
