<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" width="1440" height="560" fill="none" role="presentation">
  <!-- /models hero 背景:模型目錄 = 方塊網格,一格燼橘(被選中的那個)。左半留白給文案。 -->
  <defs>
    <filter id="g" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="4" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="s"/>
      <feComponentTransfer in="s" result="a"><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
      <feComposite in="a" in2="SourceAlpha" operator="in" result="m"/>
      <feBlend in="SourceGraphic" in2="m" mode="multiply"/>
    </filter>
  </defs>
  <g filter="url(#g)">
    <g fill="#e5e1da">
      <rect x="900" y="96" width="72" height="72" rx="14"/><rect x="996" y="96" width="72" height="72" rx="14"/>
      <rect x="1092" y="96" width="72" height="72" rx="14"/><rect x="1188" y="96" width="72" height="72" rx="14"/>
      <rect x="1284" y="96" width="72" height="72" rx="14"/>
      <rect x="900" y="192" width="72" height="72" rx="14"/><rect x="996" y="192" width="72" height="72" rx="14"/>
      <rect x="1188" y="192" width="72" height="72" rx="14"/><rect x="1284" y="192" width="72" height="72" rx="14"/>
      <rect x="900" y="288" width="72" height="72" rx="14"/><rect x="1092" y="288" width="72" height="72" rx="14"/>
      <rect x="1188" y="288" width="72" height="72" rx="14"/><rect x="1284" y="288" width="72" height="72" rx="14"/>
      <rect x="996" y="384" width="72" height="72" rx="14"/><rect x="1092" y="384" width="72" height="72" rx="14"/>
      <rect x="1188" y="384" width="72" height="72" rx="14"/>
    </g>
    <g fill="#b0aca6">
