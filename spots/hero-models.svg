      <rect x="1284" y="384" width="72" height="72" rx="14"/>
    </g>
    <rect x="996" y="288" width="72" height="72" rx="14" fill="#f04d3b"/>
  </g>
  <g stroke="#2a2a28" stroke-width="1.4" stroke-linecap="round" opacity="0.45" fill="none">
    <path d="M1032 250v26"/><path d="M1024 268l8 10 8-10"/>
